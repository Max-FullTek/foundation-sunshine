name: Update External Driver Tools
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'nefcon release tag; blank resolves the latest release'
        type: string
        default: ''
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pinned nefcon archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            version=$(gh api repos/nefarius/nefcon/releases/latest --jq .tag_name)
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          digest=$(gh api "repos/nefarius/nefcon/releases/tags/$version" --jq ".assets[] | select(.name == \"nefcon_${version}.zip\") | .digest")
          digest="${digest#sha256:}"
          [[ "$digest" =~ ^[0-9a-fA-F]{64}$ ]]
          sed -i "s|set(NEFCON_VERSION \"[^\"]*\"|set(NEFCON_VERSION \"$version\"|" cmake/packaging/FetchDriverDeps.cmake
          sed -i "s|set(NEFCON_SHA256 \"[^\"]*\"|set(NEFCON_SHA256 \"${digest,,}\"|" cmake/packaging/FetchDriverDeps.cmake
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'Update pinned nefcon tool'
          title: 'Update pinned nefcon tool'
          body: 'Updates the external installation tool and its archive hash. Foundation VDD and mouse payloads remain independently source-pinned in src_assets/windows/drivers.'
          branch: codex/update-nefcon
